<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caza Patos · Caracas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
:root{--bg:#14103a;--ink:#f3f0ff;--muted:#9a94d6;--focus:#ffb02e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14103a;--ink:#f3f0ff}}
:root[data-theme="dark"]{--bg:#14103a;--ink:#f3f0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;overscroll-behavior:none}
canvas{display:block;width:min(100%,calc((100vh - 90px)*0.6923));max-width:440px;aspect-ratio:360/520;border-radius:14px;touch-action:none;cursor:crosshair;outline-offset:3px;-webkit-tap-highlight-color:transparent}
canvas:focus-visible{outline:3px solid var(--focus)}
p{margin:0;font-size:.85rem;color:var(--muted);text-align:center}
button{font:inherit;font-size:.85rem;color:var(--ink);background:#1b1747;border:1px solid #3a3470;border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<canvas id="g" width="360" height="520" tabindex="0" aria-label="Juego Caza Patos"></canvas>
<p>Toca o haz clic para disparar. Tienes 3 balas por ronda.</p>
<button id="m" aria-pressed="false">Sonido: activado</button>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=360,H=520,F='Bungee, Impact, sans-serif';
let dog=null,muted=false,ac=null,master=null,ambOn=false,nb=null,st='intro',introT=0,score=0,level=1,roundIdx=0,hits=[],hitIdx=0,ducks=[],shots=3,awayT=-1,nextT=-1,banner='',bannerT=0,flash=null,best=0,mx=-99,my=-99,mouse=false;
try{best=+localStorage.getItem('cazapatos-best')||0}catch(e){}
const R=Math.random,sp=()=>110+level*20;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;const cp=ac.createDynamicsCompressor();master.connect(cp);cp.connect(ac.destination)}catch(e){ac=null}}
 if(ac&&ac.state==='suspended')ac.resume();return ac}
function nbuf(){if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}return nb}
function env(g,t,a,dur,peak){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function bark(p,g,w){if(!audio())return;const t=ac.currentTime+(w||0);
 const o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();
 o.type='sawtooth';const j=.94+R()*.12;o.frequency.setValueAtTime(260*p*j,t);o.frequency.exponentialRampToValueAtTime(430*p*j,t+.04);o.frequency.exponentialRampToValueAtTime(170*p*j,t+.21);const o2=ac.createOscillator();o2.type='square';o2.frequency.setValueAtTime(262*p*j,t);o2.frequency.exponentialRampToValueAtTime(433*p*j,t+.04);o2.frequency.exponentialRampToValueAtTime(171*p*j,t+.21);o2.connect(f);o2.start(t);o2.stop(t+.25);
 f.type='bandpass';f.frequency.value=950*p;f.Q.value=1.6;env(v,t,.01,.24,g*1.8);
 o.connect(f);f.connect(v);v.connect(master);o.start(t);o.stop(t+.22);
 const n=ac.createBufferSource(),h=ac.createBiquadFilter(),q=ac.createGain();n.buffer=nbuf();h.type='highpass';h.frequency.value=1100;env(q,t,.01,.14,g*.9);
 n.connect(h);h.connect(q);q.connect(master);n.start(t);n.stop(t+.12)}
function shotSnd(){if(!audio())return;const t=ac.currentTime,n=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();
 n.buffer=nbuf();f.type='highpass';f.frequency.value=700;env(v,t,.002,.09,1);n.connect(f);f.connect(v);v.connect(master);n.start(t);n.stop(t+.2);
 const o=ac.createOscillator(),w=ac.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(32,t+.25);env(w,t,.003,.3,1);o.connect(w);w.connect(master);o.start(t);o.stop(t+.32);const e=ac.createBufferSource(),ef=ac.createBiquadFilter(),eg=ac.createGain();e.buffer=nbuf();ef.type='lowpass';ef.frequency.value=700;env(eg,t+.1,.01,.7,.35);e.connect(ef);ef.connect(eg);eg.connect(master);e.start(t+.1);e.stop(t+.85)}
function quack(){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(300,t+.14);f.type='bandpass';f.frequency.value=1100;env(v,t,.01,.18,.25);
 o.connect(f);f.connect(v);v.connect(master);o.start(t);o.stop(t+.2)}
function whine(){if(!audio())return;const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();
 o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(1000,t+.25);o.frequency.linearRampToValueAtTime(480,t+.7);env(v,t,.05,.7,.18);
 o.connect(v);v.connect(master);o.start(t);o.stop(t+.72)}
function horn(){if(!audio())return;const t=ac.currentTime,f=ac.createBiquadFilter(),v=ac.createGain();f.type='lowpass';f.frequency.value=1500;env(v,t,.03,.4,.04);
 [420,520].forEach(fr=>{const o=ac.createOscillator();o.type='square';o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+.42)});f.connect(v);v.connect(master)}
function startAmb(){if(ambOn||!audio())return;ambOn=true;
 const n=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();n.buffer=nbuf();n.loop=true;f.type='lowpass';f.frequency.value=380;v.gain.value=.05;n.connect(f);f.connect(v);v.connect(master);n.start();
 (function tick(){setTimeout(()=>{if(R()<.5)horn();else{bark(.6,.1);if(R()<.6)bark(.6,.08,.4)}tick()},4000+R()*7000)})()}
function laugh(){if(!audio())return;for(let i=0;i<5;i++)bark(i%2?1.15:1.35,.4,.15+i*.17)}
function startDog(){const ok=ducks.every(u=>u.s==='down');let sx=0;ducks.forEach(u=>sx+=u.x);dog={x:Math.max(50,Math.min(W-50,sx/ducks.length)),age:0,ok};
 if(ok)bark(1,.5,.15);else laugh()}
function dogDraw(){
 const a=dog.age,r=Math.max(0,Math.min(1,a*4,(1.5-a)*4)),px=dog.x+(dog.ok?0:Math.sin(a*40)*2),py=390+(1-r)*60-(dog.ok?0:Math.abs(Math.sin(a*25))*6);
 x.save();x.translate(px,py);
 x.strokeStyle='#c98b4a';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-22,-18);x.lineTo(-36,-30+Math.sin(a*20)*8);x.stroke();
 x.fillStyle='#c98b4a';x.beginPath();x.ellipse(0,-14,24,20,0,0,6.283);x.fill();
 x.fillStyle='#f4e8d0';x.beginPath();x.ellipse(4,-8,10,12,0,0,6.283);x.fill();
 x.fillStyle='#c98b4a';x.beginPath();x.arc(6,-44,17,0,6.283);x.fill();
 x.fillStyle='#5b3a1e';x.beginPath();x.ellipse(-6,-46,7,14,.3,0,6.283);x.fill();
 x.fillStyle='#e0b27a';x.beginPath();x.ellipse(22,-40,12,8,0,0,6.283);x.fill();
 x.fillStyle='#000';x.beginPath();x.arc(32,-43,4,0,6.283);x.fill();
 x.fillStyle='#7a4a24';x.beginPath();x.ellipse(11,-49,7,6,0,0,6.283);x.fill();
 if(dog.ok){x.fillStyle='#000';x.beginPath();x.arc(11,-49,2.5,0,6.283);x.fill()}else{x.strokeStyle='#000';x.lineWidth=2.5;x.beginPath();x.arc(11,-46,5,Math.PI*1.1,Math.PI*1.9);x.stroke();x.fillStyle='#5ec8ff';x.beginPath();x.ellipse(5,-38+(a*30)%8,2,3,0,0,6.283);x.fill()}
 const o=(!dog.ok&&Math.sin(a*30)>0)||(dog.ok&&a<.4);
 x.fillStyle=o?'#3a0d0d':'#e86a8a';x.beginPath();x.ellipse(24,-33,o?7:4,o?5:6,0,0,6.283);x.fill();
 x.restore();
 if(r>.7){x.font='400 14px '+F;x.textAlign='center';x.lineWidth=4;x.strokeStyle='#14103a';x.fillStyle='#fff';const s=dog.ok?'¡GUAU!':(Math.floor(a*6)%2?'¡JA JA JA!':'¡JA JA!');x.strokeText(s,px,py-72);x.fillText(s,px,py-72)}}
function startRound(){
 ducks=[0,1].map(i=>({x:70+R()*220,y:H-95,vx:(R()<.5?-1:1)*sp()*(.7+R()*.5),vy:-150,s:'fly',t:0,fl:R()*6,turn:.6+R()*.8,c:i?'#2a6fd1':'#1f8a4c'}));
 shots=3;awayT=-1;nextT=-1}
function start(){score=0;level=1;roundIdx=0;hits=[];hitIdx=0;banner='NIVEL 1';bannerT=1.4;st='play';startRound()}
function over(){st='over';whine();if(score>best){best=score;try{localStorage.setItem('cazapatos-best',best)}catch(e){}}}
function advance(){dog=null;
 roundIdx++;
 if(roundIdx>=5){
  if(hits.filter(v=>v===1).length>=6){level++;score+=1000;roundIdx=0;hits=[];hitIdx=0;banner='NIVEL '+level;bannerT=1.4}
  else{over();return}
 }
 startRound()}
function shoot(px,py){
 if(st!=='play'||shots<=0)return;
 shots--;shotSnd();flash={x:px,y:py,t:.2};
 for(let i=ducks.length-1;i>=0;i--){const u=ducks[i];
  if(u.s==='fly'&&Math.hypot(u.x-px,u.y-py)<32){u.s='hit';u.t=.4;score+=500+level*100;quack();break}}
 if(shots===0)awayT=.5}
function update(dt){
 if(st==='intro')introT+=dt;
 if(bannerT>0)bannerT-=dt;
 if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
 if(st!=='play')return;
 if(awayT>0){awayT-=dt;if(awayT<=0)ducks.forEach(u=>{if(u.s==='fly')u.away=1})}
 ducks.forEach(u=>{
  u.fl+=dt*14;
  if(u.s==='fly'){
   if(u.away){u.y-=300*dt;u.x+=u.vx*dt;if(u.x<20||u.x>W-20)u.vx*=-1;if(u.y<-40){u.s='gone';hits[hitIdx++]=2}}
   else{
    u.x+=u.vx*dt;u.y+=u.vy*dt;u.turn-=dt;
    if(u.turn<=0){u.turn=.7+R();const s=sp();u.vx=(R()<.5?-1:1)*s*(.6+R()*.6);u.vy=(R()-.65)*s*1.3}
    if(u.x<24){u.x=24;u.vx=Math.abs(u.vx)}
    if(u.x>W-24){u.x=W-24;u.vx=-Math.abs(u.vx)}
    if(u.y<44){u.y=44;u.vy=Math.abs(u.vy)}
    if(u.y>340){u.y=340;u.vy=-Math.abs(u.vy)}
   }
  }else if(u.s==='hit'){u.t-=dt;if(u.t<=0){u.s='fall';u.vy=0;u.t=0}}
  else if(u.s==='fall'){u.vy+=900*dt;u.y+=u.vy*dt;u.t+=dt;if(u.y>H-90){u.s='down';hits[hitIdx++]=1}}
 });
 if(ducks.every(u=>u.s==='down'||u.s==='gone')){
  if(nextT<0){nextT=1.5;startDog()}nextT-=dt;if(dog)dog.age+=dt;if(nextT<=0){nextT=-1;advance()}
 }
}
function duck(u){
 x.save();x.translate(u.x,u.y);x.scale(u.vx<0?-1:1,1);
 if(u.s==='fall')x.rotate(u.t*9);
 const f=u.s==='fly'?Math.sin(u.fl):0;
 x.fillStyle='#5a3418';x.beginPath();x.moveTo(-18,-2);x.lineTo(-30,-8);x.lineTo(-18,5);x.fill();
 x.fillStyle='#7a4a24';x.beginPath();x.ellipse(0,0,20,12,0,0,6.283);x.fill();
 x.fillStyle='#fff';x.beginPath();x.arc(12,-4,5,0,6.283);x.fill();
 x.fillStyle=u.c;x.beginPath();x.arc(17,-9,8,0,6.283);x.fill();
 x.fillStyle='#ffb02e';x.beginPath();x.ellipse(27,-7,6,3,0,0,6.283);x.fill();
 if(u.s==='fly'){x.fillStyle='#000';x.beginPath();x.arc(19,-11,2,0,6.283);x.fill()}
 else{x.strokeStyle='#000';x.lineWidth=1.5;x.beginPath();x.moveTo(17,-13);x.lineTo(21,-9);x.moveTo(21,-13);x.lineTo(17,-9);x.stroke()}
 x.fillStyle='#a06a3a';x.beginPath();x.moveTo(-6,-4);x.lineTo(-16,-10-f*22);x.lineTo(4,-3);x.closePath();x.fill();
 x.restore()}
function txt(t,y,sz,col,al){x.font='400 '+sz+'px '+F;x.textAlign=al||'center';x.fillStyle=col;x.fillText(t,al==='left'?14:al==='right'?W-14:W/2,y)}
function small(t,y,col){x.font='16px system-ui,sans-serif';x.textAlign='center';x.fillStyle=col;x.fillText(t,W/2,y)}
function scene(){
 const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,'#4aa8e0');g.addColorStop(1,'#ffe2b0');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff';[[70,70,30],[96,64,24],[270,100,28],[294,94,20]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2],0,6.283);x.fill()});
 const ridge=(col,pts)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,400);pts.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(W,400);x.fill()};
 ridge('#5b9a86',[[0,300],[40,250],[90,272],[150,215],[210,255],[260,228],[320,268],[360,240]]);
 [[140,25,150,'#6b7a99'],[172,25,160,'#5a6786'],[60,30,250,'#8a93ad'],[215,36,255,'#8a93ad'],[255,28,235,'#7d88a6']].forEach(b=>{x.fillStyle=b[3];x.fillRect(b[0],b[2],b[1],400-b[2]);x.fillStyle='rgba(255,255,255,.18)';for(let y=b[2]+6;y<390;y+=9)x.fillRect(b[0]+3,y,b[1]-6,2)});
 ridge('#2f6b52',[[0,335],[70,290],[140,315],[230,285],[300,310],[360,292]]);
 const cols=['#e8743b','#f2c14e','#4aa3b5','#d95d7a','#9bc67a','#c98b4a'];
 for(let r=0;r<4;r++)for(let k=0;k<4-r;k++){[0,1].forEach(s=>{const bx=-4+k*24+r*12,px=s?W-bx-22:bx,py=372-r*18;
  x.fillStyle=cols[(k*2+r*3+s*2)%6];x.fillRect(px,py,22,17);x.fillStyle='#8b8b92';x.fillRect(px-1,py-3,24,3);x.fillStyle='#2a2320';x.fillRect(px+6,py+6,6,7)})}
 x.strokeStyle='#3a2f2a';x.lineWidth=3;[110,250].forEach(px=>{x.beginPath();x.moveTo(px,390);x.lineTo(px,255);x.moveTo(px-14,266);x.lineTo(px+14,266);x.stroke()});
 x.lineWidth=1;x.strokeStyle='#2a2320';[0,5,10].forEach(o=>{x.beginPath();x.moveTo(0,262+o);x.quadraticCurveTo(55,285+o,110,264+o);x.quadraticCurveTo(180,288+o,250,264+o);x.quadraticCurveTo(305,284+o,W,262+o);x.stroke()});
}
function wall(){
 x.fillStyle='#b3ab9e';x.fillRect(0,H-130,W,90);
 x.fillStyle='#ffd23f';x.fillRect(0,H-130,W,5);x.fillStyle='#2d5bd6';x.fillRect(0,H-125,W,5);x.fillStyle='#e03a3a';x.fillRect(0,H-120,W,5);
 x.fillStyle='#9d9588';for(let i=0;i<W;i+=45)x.fillRect(i,H-115,2,75);
 x.font='400 30px '+F;x.textAlign='center';x.lineWidth=5;x.strokeStyle='#14103a';x.fillStyle='#f2c14e';x.strokeText('CARACAS',W/2,H-62);x.fillText('CARACAS',W/2,H-62);
 x.fillStyle='#14103a';x.fillRect(0,H-40,W,40)}
function hud(){
 for(let i=0;i<3;i++){x.fillStyle=i<shots?'#ffb02e':'#4a4a6a';x.beginPath();x.arc(24+i*18,H-20,6,0,6.283);x.fill()}
 for(let i=0;i<10;i++){const v=hits[i];x.fillStyle=v===1?'#5ee08a':v===2?'#ff5c5c':'#4a4a6a';x.fillRect(96+i*13,H-26,9,12)}
 txt(String(score),H-12,16,'#f3f0ff','right')}
function intro(){
 x.fillStyle='rgba(20,16,58,.6)';x.fillRect(0,0,W,H);
 const t=introT,fd=(a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),e=1-Math.pow(1-fd(0,.9),3);
 x.save();x.globalAlpha=fd(0,.4);txt('CAZA PATOS',-40+170*e,44,'#ffb02e');x.restore();
 x.save();x.globalAlpha=fd(1,1.5);small('Calles de Caracas',160,'#f3f0ff');x.restore();
 x.save();x.globalAlpha=fd(1.6,2.1);txt('CÓMO JUGAR',215,18,'#f2c14e');x.restore();
 ['Toca la pantalla para disparar','Tienes 3 balas por ronda','Acierta 6 de 10 patos para subir de nivel'].forEach((l,i)=>{x.save();x.globalAlpha=fd(2+i*.5,2.5+i*.5);small(l,247+i*27,'#d6d2ff');x.restore()});
 if(t>3.6&&Math.floor(t*2)%2===0)txt('TOCA PARA JUGAR',370,20,'#ffb02e');
 if(best&&t>3.6)small('Récord: '+best,400,'#d6d2ff')}
function draw(){
 scene();
 if(st==='intro')[0,1,2].forEach(i=>duck({x:((introT*70+i*140)%(W+120))-60,y:90+i*55+Math.sin(introT*3+i)*14,vx:1,s:'fly',fl:introT*14+i*2,c:i%2?'#2a6fd1':'#1f8a4c',t:0}));
 ducks.forEach(u=>{if(u.s!=='down'&&u.s!=='gone')duck(u)});
 if(dog)dogDraw();wall();hud();
 if(flash){x.strokeStyle='rgba(255,255,255,'+(flash.t/.2)+')';x.lineWidth=3;x.beginPath();x.arc(flash.x,flash.y,(.2-flash.t)*120+6,0,6.283);x.stroke()}
 if(st==='play'&&bannerT>0)txt(banner,200,34,'#14103a');
 if(st==='play'&&mouse){x.strokeStyle='#ff3b3b';x.lineWidth=2;x.beginPath();x.arc(mx,my,14,0,6.283);x.moveTo(mx-20,my);x.lineTo(mx+20,my);x.moveTo(mx,my-20);x.lineTo(mx,my+20);x.stroke()}
 if(st==='intro')intro();
 if(st==='menu'){x.fillStyle='rgba(20,16,58,.55)';x.fillRect(0,0,W,H);txt('CAZA PATOS',210,42,'#ffb02e');small('Calles de Caracas',245,'#f3f0ff');small('Dispara antes de que escapen',268,'#d6d2ff');txt('TOCA PARA JUGAR',320,20,'#f3f0ff');if(best)small('Récord: '+best,360,'#d6d2ff')}
 if(st==='over'){x.fillStyle='rgba(20,16,58,.78)';x.fillRect(0,0,W,H);txt('FIN DEL JUEGO',195,30,'#ff5c8a');txt(score+' puntos',250,26,'#f3f0ff');small(score>=best&&score>0?'¡Nuevo récord!':'Récord: '+best,285,'#d6d2ff');small('Necesitas 6 de 10 patos por nivel',315,'#d6d2ff');txt('TOCA PARA REINTENTAR',370,17,'#ffb02e')}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function pos(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
c.addEventListener('pointerdown',e=>{audio();startAmb();const q=pos(e);mx=q[0];my=q[1];mouse=e.pointerType==='mouse';if(st==='intro'){if(introT<3.6)introT=3.6;else start()}else if(st!=='play')start();else shoot(q[0],q[1])});
c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const q=pos(e);mx=q[0];my=q[1];mouse=true}});
document.getElementById('m').onclick=function(){muted=!muted;this.textContent='Sonido: '+(muted?'desactivado':'activado');this.setAttribute('aria-pressed',muted);if(master)master.gain.value=muted?0:1};
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&st!=='play'){if(st==='intro'){if(introT<3.6)introT=3.6;else start()}else start();e.preventDefault()}});
</script>
</body>
</html>
